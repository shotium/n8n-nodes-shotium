# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Release tags use bare SemVer with no "v" prefix (for example, 0.2.0).
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Follow the release checklist in AGENTS.md. Prepare and commit all version
# metadata locally, then push the version tag. Never run `npm run release`
# locally; that command is reserved for the CI publish step below.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Verify release metadata
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_package_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [ "$GITHUB_REF_NAME" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          if [ "$lock_version" != "$package_version" ] || [ "$lock_package_version" != "$package_version" ]; then
            echo "::error::package-lock.json versions ($lock_version, $lock_package_version) do not match package.json version $package_version"
            exit 1
          fi
          grep -Fxq "## $package_version" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no $package_version entry"
            exit 1
          }
          grep -Fq -- "**$package_version**" README.md || {
            echo "::error::README.md Version history has no $package_version entry"
            exit 1
          }

      - name: Install dependencies
        run: 'npm ci'

      - name: Publish
        # Publishes with npm provenance via OIDC; lint and build run automatically.
        run: 'npm run release'
